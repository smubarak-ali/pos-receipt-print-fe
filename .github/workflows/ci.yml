name: Build and Push Print App Image

on:
  push:
    branches:
      - main
    tags: ["release-*"]
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: "smubarakali/pos-print-fe"

jobs:
  build-and-push:
    if: startsWith(github.ref, 'refs/tags/release-') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image tags and labels
        id: meta_tag
        if: startsWith(github.ref, 'refs/tags/release-')
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},match=^release-(\d+\.\d+\.\d+.*)$,prefix=v

      - name: Generate image tags and labels
        id: meta_branch
        if: github.ref == 'refs/heads/main'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_tag.outputs.tags || steps.meta_branch.outputs.tags  }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
