<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>POS Receipt</title>
  <style>
    body {
      font-family: monospace;
      /*width: 300px;*/
      margin: 0 auto;
      padding: 10px;
      font-size: 12px;
    }

    .center {
      text-align: center;
    }

    .divider {
      border-top: 1px dashed #000;
      margin: 8px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 2px 0;
    }

    .right {
      text-align: right;
    }

    .bold {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="center">
    <div class="bold">ABDUL HADI MEDICAL & GENERAL STORE</div>
    <div>Shop No. 2, Azizabad</div>
    <div>Contact: 0306-3738034</div>
  </div>

  <div class="divider"></div>

  <div>
    <div>Invoice #: <span id="invNo"></span></div>
    <div>Date: <span id="invDate"></span></div>
    <div>Cashier: 700013</div>
    <div>Customer: SYED YASIR</div>
  </div>

  <div class="divider"></div>

  <table>
    <thead>
      <tr>
        <th>Item</th>
        <th class="right">Qty</th>
        <th class="right">Price</th>
        <th class="right">Total</th>
      </tr>
    </thead>
    <tbody id="receiptItems"></tbody>
  </table>

  <div class="divider"></div>

  <div>
    <div>Items Sold: <span id="itemsSold"></span></div>
    <div>No. of Items: <span id="totalItems"></span></div>
  </div>

  <div class="divider"></div>

  <table>
    <tr>
      <td>Total Amount:</td>
      <td class="right" id="totalAmount"></td>
    </tr>
    <tr>
      <td>Discount:</td>
      <td class="right" id="totalDiscount"></td>
    </tr>
    <tr class="bold">
      <td>Net Total:</td>
      <td class="right" id="netTotal"></td>
    </tr>
  </table>

  <div class="divider"></div>

  <div>
    <div>Payment Method: CASH</div>
    <div class="bold right">Rs. <span id="paidAmount"></span></div>
  </div>

  <div class="divider"></div>

  <div class="center">
    ** Thanks for Shopping **
  </div>

  <script type="module">
    import { receiveReceipt } from "./receipt-preview.js";

    receiveReceipt(receipt => {
      const receiptItems = document.getElementById("receiptItems");
      let itemsSold = 0;

      for (const item of receipt.items) {
        const row = receiptItems.insertRow();
        row.insertCell().textContent = item.productName;

        for (const value of [item.quantity, item.price, item.totalAmount]) {
          const cell = row.insertCell();
          cell.className = "right";
          cell.textContent = value;
        }

        itemsSold += Number(item.quantity);
      }

      const invoiceDate = new Date(receipt.date).toLocaleString("en-GB", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).replace(",", "");

      document.getElementById("invNo").textContent = receipt.invoiceNumber;
      document.getElementById("invDate").textContent = invoiceDate;
      document.getElementById("itemsSold").textContent = itemsSold;
      document.getElementById("totalItems").textContent = receipt.items.length;
      document.getElementById("totalAmount").textContent = receipt.totalAmount;
      document.getElementById("totalDiscount").textContent = receipt.totalDiscount;
      document.getElementById("netTotal").textContent = receipt.netTotal;
      document.getElementById("paidAmount").textContent = receipt.netTotal;
    });
  </script>
</body>

</html>
