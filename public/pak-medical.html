<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pak Medical Receipt</title>
    <style>
      body {
        font-family: monospace;
        background: #fff;
        /* padding: 1px; */
      }

      h2 {
        /* margin: 0; */
        font-family: "Arial black";
        font-size: 14px;
        font-weight: bolder;
        text-align: center;
        margin-block-end: 0.2em;
      }

      h4 {
        text-align: center;
        margin-block-start: 0em;
        margin-block-end: 0em;
      }

      .title {
        font-size: 14pt;
        margin: 5px 0;
        padding: 3px 0;
        text-align: center;
        color: #000;
        text-decoration: underline;
        font-weight: bolder;
      }

      .details,
      .summary {
        text-align: left;
        font-size: 10pt;
      }

      .details td,
      .summary td {
        padding: 2px 0;
      }

      .items-table {
        width: 100%;
        font-size: 8.5pt;
        border-collapse: collapse;
        margin-top: 8px;
      }

      .items-table th,
      .items-table td {
        border-bottom: 1px solid #000;
        padding: 4px 2px;
        text-align: center;
      }

      .items-table th {
        font-weight: bold;
        text-align: center;
      }

      .items-table td:last-child,
      .items-table th:last-child {
        text-align: right;
      }

      .total-line {
        border-top: 1px solid #000;
        margin-top: 8px;
        padding-top: 8px;
        font-weight: bold;
      }

      .amount-in-words {
        margin-top: 8px;
        font-size: 9pt;
        font-style: italic;
        text-align: left;
      }

      /* @media only screen and (max-width: 600px) {
        .details table tbody tr td:first-child {
            width: 50% !important;
        }
      } */

    </style>
  </head>
  <body>
    <div class="pak-medical">
      <h2>PAK MEDICAL & GENERAL</h2>
      <h4>Address: Shop No. 1-2, Plot No. 563, Block 3, Hussainabad F.B.Area</h4>
      <div class="title">BILL</div>

      <div class="details">
        <table style="width: 100%;">
          <tr>
            <td style="width: 50%;"><strong>Customer Name:</strong></td>
            <td>YASIR</td>
          </tr>
          <tr>
            <td style="width: 50%; font-size: 15pt;"><strong>Invoice No:</strong></td>
            <td style="font-size: 15pt;" id="invNo"></td>
          </tr>
        </table>
        <table style="width: 100%;">
          <tr>
            <td style="width: 30%;"><strong>Date/Time:</strong></td>
            <td id="invDate">
            </td>
          </tr>
        </table>
      </div>

      <table class="items-table" id="myTable">
        <thead>
          <tr>
            <th style="width: 10%">Qty</th>
            <th style="width: 50%">Item(s)</th>
            <th style="width: 15%">Price</th>
            <th style="width: 10%">Disc</th>
            <th style="width: 15%">Amount</th>
          </tr>
        </thead>
        <tbody>

        </tbody>
      </table>

      <div class="summary">
        <table style="width: 100%;">
          <tr>
            <td><strong>Total Items:</strong></td>
            <td id="totalItem"></td>
          </tr>
          <tr>
            <td><strong>Total:</strong></td>
            <td style="text-align: right;" id="totalAmount"></td>
          </tr>
          <tr>
            <td><strong>Discount:</strong></td>
            <td style="text-align: right;" id="totalDiscount"></td>
          </tr>
          <tr class="total-line">
            <td><strong>Net Amount:</strong></td>
            <td style="text-align: right;"><strong id="netTotal"></strong></td>
          </tr>
        </table>
      </div>

      <!-- <div class="amount-in-words">
            One thousand Two Hundred Five Only
        </div> -->
    </div>

    <script type="module">
      import { receiveReceipt } from "./receipt-preview.js";

      receiveReceipt((receipt, discountRate) => {
        const items = document.querySelector("#myTable tbody");
        const discount = discountRate / 100;
        for (const item of receipt.items) {
          const row = items.insertRow();
          row.insertCell().textContent = item.quantity;
          row.insertCell().textContent = item.productName;
          row.insertCell().textContent = item.price;
          row.insertCell().textContent = (item.price * discount).toFixed(2);
          row.insertCell().textContent = (item.totalAmount - item.quantity * discount).toFixed(2);
        }

        document.getElementById("invNo").textContent = receipt.invoiceNumber;
        document.getElementById("totalItem").textContent = receipt.items.length;
        document.getElementById("totalAmount").textContent = Number(receipt.totalAmount).toFixed(2);
        document.getElementById("totalDiscount").textContent = Number(receipt.totalDiscount).toFixed(2);
        document.getElementById("netTotal").textContent = Number(receipt.netTotal).toFixed(2);
        document.getElementById("invDate").textContent = new Date(receipt.date).toLocaleString(undefined, { hour12: true, dateStyle: "full", timeStyle: "medium" });
      });
    </script>
  </body>
</html>
